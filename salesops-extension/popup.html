<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --green:  #33ff00;
      --amber:  #ffb000;
      --red:    #ff3333;
      --bg:     #0a0a0a;
      --bg2:    #0d0d0d;
      --border: #1f521f;
      --dim:    #2a6a2a;
      --muted:  #4a7a4a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 300px;
      background: var(--bg);
      color: var(--green);
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      overflow: hidden;
    }

    /* Scanline overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.07) 2px,
        rgba(0,0,0,0.07) 4px
      );
      pointer-events: none;
      z-index: 9999;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 6px var(--green); }
      50% { opacity: 0.5; box-shadow: 0 0 2px var(--green); }
    }

    /* ── Title bar ── */
    .titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 12px;
      background: var(--green);
      color: var(--bg);
      font-weight: bold;
      font-size: 11px;
      letter-spacing: 1px;
    }

    .titlebar-blink {
      animation: blink 1s step-end infinite;
      color: var(--bg);
    }

    /* ── Body ── */
    .body {
      padding: 14px 12px;
    }

    /* ── Status row ── */
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      background: var(--bg2);
      border: 1px solid var(--border);
      margin-bottom: 12px;
      font-size: 11px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--dim);
      flex-shrink: 0;
    }

    .status-dot.active {
      background: var(--green);
      animation: pulse 2s infinite;
    }

    .status-dot.error {
      background: var(--red);
    }

    #statusText {
      color: var(--muted);
      flex: 1;
    }

    #statusText.active { color: var(--green); }
    #statusText.error  { color: var(--red); }

    /* ── Main button ── */
    .btn {
      width: 100%;
      padding: 11px 0;
      border: 1px solid var(--green);
      background: transparent;
      color: var(--green);
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .btn:hover {
      background: var(--green);
      color: var(--bg);
    }

    .btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .btn-stop {
      border-color: var(--red);
      color: var(--red);
    }

    .btn-stop:hover {
      background: var(--red);
      color: var(--bg);
    }

    /* ── Stats ── */
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .stat {
      background: var(--bg2);
      border: 1px solid var(--border);
      padding: 8px 10px;
    }

    .stat-label {
      font-size: 9px;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .stat-value {
      font-size: 20px;
      font-weight: bold;
      color: var(--green);
      margin-top: 2px;
      text-shadow: 0 0 8px rgba(51,255,0,0.4);
    }

    /* ── Footer ── */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-top: 1px solid var(--border);
      font-size: 10px;
      color: var(--dim);
      background: var(--bg2);
    }

    .footer a {
      color: var(--muted);
      text-decoration: none;
      letter-spacing: 0.5px;
      transition: color 0.1s;
    }

    .footer a:hover { color: var(--green); }
  </style>
</head>
<body>

  <div class="titlebar">
    <span>PIF.EXE &nbsp;// &nbsp;AI SALES CO-PILOT</span>
    <span class="titlebar-blink">█</span>
  </div>

  <div class="body">

    <div class="status-row">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Not listening</span>
    </div>

    <button class="btn btn-start" id="mainBtn">[ Start Listening ]</button>

    <div class="stats" id="stats" style="display:none;">
      <div class="stat">
        <div class="stat-label">Duration</div>
        <div class="stat-value" id="duration">0:00</div>
      </div>
      <div class="stat">
        <div class="stat-label">Suggestions</div>
        <div class="stat-value" id="suggestions">0</div>
      </div>
    </div>

  </div>

  <div class="footer">
    <span>// overlay visible to you only</span>
    <a id="openSettings" href="#">[cfg]</a>
  </div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
